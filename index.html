<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verinvo Onboarding — Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F8F8;--card:#FFFFFF;--ink:#0F2A2E;--sec:#4A5B5E;--mut:#8A9A9C;
  --line:#E7ECEC;--line2:#D8E0E0;--soft:#F1F5F5;--navy:#0F2A2E;
  --blue:#2F6BE8;--green:#1B9E63;--red:#E0483C;--amber:#E0900C;
  --sidebar:#0B1F24;--sidebar-mut:#8AA0A3;--sidebar-hover:#12292F;--sidebar-active:#14343B;
  --mint-1:#EAF6F0;--mint-line:#CDE8D8;
  --brand:#2F6BE8;--brand600:#2457C4;--brand-bg:#E9F0FD;
  --teal:var(--brand);--teal600:var(--brand600);--teal-bg:var(--brand-bg);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(24,34,48,.04),0 4px 16px rgba(24,34,48,.05);
  --sh-lg:0 24px 64px rgba(24,34,48,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--brand)}.amber{color:var(--amber)}

/* ===== launcher ===== */
#launcher{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px;background:radial-gradient(1100px 520px at 50% -8%,#E9EEF6,transparent),var(--bg)}
.lh-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--sec);background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 13px;margin-bottom:16px}
.lh-badge i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.lh-top{text-align:center;margin-bottom:28px}
.lh-top h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0}
.lh-top p{color:var(--sec);margin:8px auto 0;max-width:560px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,272px));gap:16px;max-width:900px}
.rolecard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;box-shadow:var(--sh);transition:.14s;position:relative;overflow:hidden}
.rolecard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--line2)}
.rc-logo{width:44px;height:44px;border-radius:13px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-bottom:14px}
.rolecard h3{margin:0;font-size:16px;font-weight:800}
.rolecard .who{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.rolecard .desc{font-size:13px;color:var(--sec);margin:11px 0 14px;min-height:52px}
.brandline{font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px}
.rolecard .go{position:absolute;right:18px;bottom:18px;color:var(--mut);opacity:0;transition:.14s}
.rolecard:hover .go{opacity:1}
.lh-note{margin-top:26px;max-width:820px;text-align:center;font-size:12.5px;color:var(--mut);background:#fff;border:1px dashed var(--line2);border-radius:14px;padding:13px 18px}
.lh-note b{color:var(--sec)}

/* ===== shell ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--sidebar);color:#fff;border-right:0;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;flex:none;overflow-y:auto}
.brandblock{display:flex;align-items:center;gap:11px;padding:4px 6px 18px}
.brandblock .bl{width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.brandblock .bn{font-weight:800;font-size:14.5px;line-height:1.15;color:#fff}
.brandblock .bs{font-size:9.5px;letter-spacing:.08em;color:var(--sidebar-mut);font-weight:800;text-transform:uppercase;margin-top:3px}
.addbtn{width:100%;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;padding:12px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.addbtn:hover{filter:brightness(1.06)}
.nav{width:100%;border:0;background:transparent;color:#C6D4D6;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;margin-bottom:2px}
.nav svg{flex:none;opacity:.85}
.nav:hover{background:var(--sidebar-hover);color:#fff}
.nav.on{background:var(--sidebar-active);color:#fff}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.1);color:#C6D4D6;border-radius:20px;padding:1px 8px}
.nav.on .cnt{background:rgba(255,255,255,.18);color:#fff}
.nav .cnt.alert{background:#5A2521;color:#FCA79E}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding-top:12px}
.rolepill{display:flex;align-items:center;gap:9px;padding:8px;border-radius:11px;background:var(--sidebar-hover)}
.rolepill .ra{width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.rolepill .rt{font-size:12px;font-weight:800;line-height:1.1;color:#fff}.rolepill .rr{font-size:10.5px;color:var(--sidebar-mut);font-weight:700}
.rolepill .sw{margin-left:auto;border:1px solid rgba(255,255,255,.16);background:transparent;color:#C6D4D6;font-weight:800;font-size:10.5px;border-radius:8px;padding:5px 8px}
.rolepill .sw:hover{border-color:rgba(255,255,255,.4);color:#fff}

.main{flex:1;min-width:0}
.content{padding:24px 28px 90px;max-width:1240px}
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.phead h1{font-size:25px;font-weight:700;margin:0;letter-spacing:-.02em}
.phead p{margin:4px 0 0;color:var(--sec);font-size:13px}
.userpill{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:20px;padding:5px 12px 5px 6px;font-size:12.5px;font-weight:800;color:var(--sec)}
.userpill .ua{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}

.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:13px;font-weight:800;padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{background:var(--soft)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{filter:brightness(.95)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-lg{padding:12px 20px;font-size:15px;border-radius:12px}
.btn-block{width:100%;justify-content:center}
.btn svg{flex:none}

.toggle{display:inline-flex;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:3px;gap:2px}
.toggle button{border:0;background:transparent;color:var(--sec);font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:8px}
.toggle button.on{background:var(--navy);color:#fff}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}
.statc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 19px;box-shadow:var(--sh)}
.statc .lb{font-size:12px;color:var(--sec);font-weight:800}
.statc b{display:block;font-size:29px;font-weight:800;line-height:1;margin:8px 0 5px;letter-spacing:-.02em}
.statc .sub{font-size:11.5px;color:var(--mut);font-weight:600}
.metricstrip{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.metricstrip .m{padding:15px 18px;border-right:1px solid var(--line)}
.metricstrip .m:last-child{border-right:0}
.metricstrip .ml{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.metricstrip .mv{font-size:17px;font-weight:800;margin-top:5px}
.metricstrip .ms{font-size:11px;color:var(--mut);margin-top:2px}
.seclabel{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 12px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:20px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:20px 22px}
.pcard .hh{font-size:15px;font-weight:800}
.pcard .hs{font-size:12px;color:var(--sec);margin-top:2px}
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--sec)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
/* bar chart */
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;margin-top:18px;padding-top:26px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.barcol .cap{position:absolute;top:-24px;text-align:center;font-size:12px;font-weight:800}
.barcol .cap small{display:block;font-size:10.5px;color:var(--green);font-weight:800}
.barstack{width:60%;max-width:34px;background:var(--brand);border-radius:6px 6px 0 0;position:relative;overflow:hidden;display:flex;flex-direction:column-reverse}
.barstack .live{background:var(--green);width:100%}
.barcol .xl{margin-top:8px;font-size:11px;color:var(--mut);font-weight:700}
/* donut */
.donutwrap{display:flex;align-items:center;gap:18px;margin-top:14px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.donut::after{content:"";position:absolute;width:74px;height:74px;background:#fff;border-radius:50%}
.donut .dc{position:relative;z-index:1;text-align:center}
.donut .dc b{font-size:19px;font-weight:800;display:block;line-height:1}.donut .dc span{font-size:10px;color:var(--mut);font-weight:700}
.dleg{display:flex;flex-direction:column;gap:9px}
.dleg .di{display:flex;align-items:center;gap:9px;font-size:12.5px}
.dleg .di i{width:9px;height:9px;border-radius:3px;flex:none}
.dleg .di b{font-weight:800}.dleg .di span{color:var(--mut);font-size:11.5px}
/* quota */
.qhead{display:flex;align-items:baseline;gap:8px}
.qhead b{font-size:24px;font-weight:800;color:var(--brand)}.qhead span{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700}
.qbar{height:9px;border-radius:6px;background:var(--soft);margin:10px 0 6px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.qnote{font-size:11.5px;color:var(--mut)}
.qrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:13px;font-weight:800}
.qrow .qv{color:var(--green)}
.qmini{height:6px;border-radius:4px;background:var(--soft);width:120px;overflow:hidden;margin-left:auto;margin-right:12px}
.qmini i{display:block;height:100%}

/* ===== kanban ===== */
.kbar{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);display:flex;gap:0;margin-bottom:14px}
.kbar .kb{padding:14px 20px;border-right:1px solid var(--line)}
.kbar .kb:last-child{border-right:0}
.kbar .kl{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.kbar .kv{font-size:17px;font-weight:800;margin-top:4px}
.kbar .kv small{font-size:12px;color:var(--sec);font-weight:700}
.kfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kfilters .fp{border:1px solid var(--line2);background:#fff;color:var(--sec);font-weight:800;font-size:12px;padding:6px 13px;border-radius:20px}
.kfilters .fp.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kgroups{display:flex;gap:16px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
.kgroups .g i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:6px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.kcol{flex:0 0 236px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px}
.kcol .ch{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
.kcol .ch .cn{font-size:12.5px;font-weight:800}
.kcol .ch .cc{font-size:11px;font-weight:800;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(24,34,48,.04);cursor:pointer;transition:.12s}
.kcard:hover{border-color:var(--line2);box-shadow:var(--sh)}
.kcard .kn{font-weight:800;font-size:13px;margin-bottom:5px;line-height:1.25}
.kcard .ka{font-size:12px;color:var(--sec);margin-bottom:9px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tg{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.tg-blue{background:#E7EEFB;color:var(--brand)}.tg-red{background:#FDEAE8;color:var(--red)}.tg-green{background:#E4F6EC;color:var(--green)}.tg-amber{background:#FCF1DB;color:var(--amber)}
.kmeta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:9px}
.av{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.kprog{display:flex;align-items:center;gap:8px}
.kprog .pb{flex:1;height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.kprog .pb i{display:block;height:100%;background:var(--brand);border-radius:3px}
.kprog .pv{font-size:10.5px;font-weight:800;color:var(--sec)}
.kprog .eu{font-size:10.5px;font-weight:800;color:var(--mut)}

/* ===== tables ===== */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:#fff;color:var(--mut);font-size:13px;min-width:250px}
.search input{border:0;outline:0;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.dd{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:800;color:var(--sec);background:#fff}
.tablecard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{text-align:left;font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:12px 18px;border-bottom:1px solid var(--line)}
tbody td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--soft)}
.cname{font-weight:800}.csub{font-size:11.5px;color:var(--mut);font-weight:600}
.tav{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--sec);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)}
.namecell{display:flex;align-items:center;gap:11px}
.spill{font-size:12px;font-weight:800;padding:4px 11px;border-radius:8px;white-space:nowrap;display:inline-block}
.sp-gray{background:var(--soft);color:var(--sec);border:1px solid var(--line)}
.sp-amber{background:#FCF1DB;color:var(--amber)}
.sp-blue{background:#E7EEFB;color:var(--brand)}
.sp-green{background:#E4F6EC;color:var(--green)}
.rtag{font-size:11px;font-weight:800;padding:2px 9px;border-radius:6px}
.doit{border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:800;font-size:12px;padding:6px 13px;border-radius:9px}
.doit:hover{background:var(--soft)}
.over{color:var(--red);font-weight:800}

/* ===== messages ===== */
.msgcols{display:grid;grid-template-columns:400px 1fr;gap:16px}
.threadlist{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.tl-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.thread{padding:14px 18px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.thread:hover{background:var(--soft)}
.thread.on{background:var(--soft);border-left-color:var(--brand)}
.thread .tt{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.thread .cn2{font-weight:800;font-size:13px}
.thread .chn{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.04em}
.thread .sub2{font-size:12px;color:var(--sec);margin-bottom:6px}
.thread .row3{display:flex;align-items:center;gap:8px}
.stt{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px}
.stt-read{background:#FDEAE8;color:var(--red)}
.stt-rep{background:#E4F6EC;color:var(--green)}
.stt-wait{background:#FCF1DB;color:var(--amber)}
.stt-none{background:var(--soft);color:var(--sec);border:1px solid var(--line)}
.stt-bounce{background:#FDEAE8;color:var(--red)}
.thread .tm{font-size:11px;color:var(--mut);font-weight:700}
.conv{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column}
.conv-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.conv-h .cn3{font-weight:800;font-size:15px}
.conv-h .cs3{font-size:11.5px;color:var(--mut);font-weight:700}
.conv-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.bubble{max-width:82%}
.bubble.out{align-self:flex-start}
.bubble.inb{align-self:flex-end}
.bubble .bx{border-radius:12px;padding:11px 14px;font-size:13px}
.bubble.out .bx{background:#EEF3FC;color:var(--ink)}
.bubble.inb .bx{background:var(--soft);color:var(--ink)}
.bubble .bt{font-weight:800;font-size:11px;color:var(--brand);margin-bottom:4px}
.bubble .meta2{font-size:10.5px;color:var(--mut);font-weight:700;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trk{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px}
.trk-g{background:#E4F6EC;color:var(--green)}.trk-b{background:#FDEAE8;color:var(--red)}.trk-n{background:var(--soft);color:var(--sec)}
.composer{padding:14px 20px;border-top:1px solid var(--line)}
.tplrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tpl{border:1px solid var(--line2);background:#fff;color:var(--sec);font-weight:800;font-size:11.5px;padding:5px 11px;border-radius:20px}
.tpl.on{background:var(--navy);border-color:var(--navy);color:#fff}
.compbox{border:1px solid var(--line2);border-radius:11px;padding:12px 14px;color:var(--mut);font-size:13px;min-height:64px}

/* ===== drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(24,34,48,.34);backdrop-filter:blur(2px);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
.scrim.open{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;box-shadow:var(--sh-lg);overflow:hidden}
.modal-h{padding:18px 20px 6px}.modal-h h3{margin:0;font-size:17px;font-weight:800}
.modal-b{padding:8px 20px 20px}.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--soft)}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:var(--sec);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}

 const chip=s=>s==='ok'?'<span class="chip ok"><i></i>Accepted</span>':s==='wait'?'<span class="chip wait"><i></i>Awaiting</span>':'<span class="chip todo"><i></i>To do</span>';
 const providerDocs=['ONESYS price list.pdf','Cancellation policy.pdf'].concat(flow.signed?['Your signed contract.pdf']:[]);
 const yourDocs=[{n:'Company details form',k:'looked',ok:!!flow.looked},{n:'Phone bill · alternative internet',k:'phonebill',ok:!!flow.phonebill}];
 $('#customer').innerHTML=`
  <div class="cust-top"><div class="l"><span class="logo2">${IC.logo}</span> ONESYS e-invoicing <span class="poweredby">· powered by Verinvo</span></div><button class="exit" id="chExit">${IC.back} Back to roles</button></div>
  <div class="chome">
   <div class="chero"><div class="sm">Your ONESYS setup</div><h1>${flow.customer}</h1>
    <div class="cprog"><i style="width:${P.pct}%"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:800;margin-bottom:12px"><span>${P.pct}% complete</span><span>${P.doneCount} of ${P.steps.length} steps done</span></div>
    <div class="cstatus">${complete?'You’re all set — ONESYS is live and issuing your e-invoices. 🎉':'Next up: <b>'+cur.t+'</b> — '+cur.d.toLowerCase()+'.'}</div>
    ${complete?'<span class="chip ok" style="font-size:13px;padding:7px 14px"><i></i>Live &amp; issuing</span>':`<button class="btn btn-primary btn-lg" id="chContinue">${P.doneCount===0?'Start setup':'Continue setup'} ${IC.arrow}</button>`}
   </div>
   <div class="pcard" style="margin-bottom:16px"><div class="hh" style="margin-bottom:6px">Your steps</div>
    ${P.steps.map((s,i)=>{const cls=s.done?'done':(i===P.curIdx?'cur':'pend');const stat=s.done?'Done':(i===P.curIdx?'Up next':'Pending');const chipcls=s.done?'ok':(i===P.curIdx?'wait':'todo');
      return `<div class="cstep"><span class="ci ${cls}">${s.done?IC.check:i+1}</span><div><div class="cn">${s.t}</div><div class="cd">${s.d}</div></div><span class="cact chip ${chipcls}"><i></i>${stat}</span></div>`;}).join('')}
   </div>
   <div class="pcard" style="margin-bottom:16px"><div class="hh" style="margin-bottom:10px">Documents</div>
    <div class="lab">From ONESYS — yours to keep</div>
    ${providerDocs.map(n=>`<div class="doc"><div class="dkind" style="background:#C0433C">PDF</div><div><div class="dn">${n}</div><div class="dm">Tap to download</div></div><span class="dstate ds-sent">download</span></div>`).join('')}
    <div class="lab" style="margin-top:14px">From you</div>
    ${yourDocs.map(d=>`<div class="doc"><div class="dkind" style="background:${d.ok?'#1E7A46':'#8B94A3'};font-size:15px">${d.ok?'✓':'?'}</div><div><div class="dn">${d.n}</div><div class="dm">${d.ok?'Received — thank you':'We still need this from you'}</div></div>${d.ok?'<span class="dstate ds-received">received</span>':`<button class="btn" data-up="${d.k}">Upload</button>`}</div>`).join('')}
   </div>
   <div class="pcard"><div class="hh" style="margin-bottom:4px">Authorization &amp; declaration</div><div class="hs" style="margin-bottom:12px">The two government-portal steps. You and your accountant both see this status live.</div>
    <div class="cstep"><div><div class="cn">Taxisnet authorization</div><div class="cd">Authorize ONESYS as your e-invoicing provider</div></div><span class="cact">${chip(flow.auth)}</span></div>
    <div class="cstep"><div><div class="cn">myDATA declaration</div><div class="cd">Declare the provider with your internet details</div></div><span class="cact">${chip(flow.decl)}</span></div>
    ${(flow.auth==='ok'&&flow.decl==='ok')?'<div class="shared" style="margin-top:14px">'+IC.check+' Both accepted — you’re ready for go-live.</div>':`<button class="btn btn-primary btn-block" id="chDecl" style="margin-top:14px">Send the declaration ${IC.arrow}</button>`}
   </div>
  </div>`;
 $('#chExit').onclick=renderLauncher;
 const cont=$('#chContinue');if(cont)cont.onclick=()=>{flow.screen=P.doneCount===0?'landing':cur.screen;enterCustomer();};
 const decl=$('#chDecl');if(decl)decl.onclick=()=>{flow.screen='gov';enterCustomer();};
 document.querySelectorAll('[data-up]').forEach(bn=>bn.onclick=()=>{flow[bn.dataset.up]=true;renderClientHome();toast('Document uploaded');});
}
function wstepper(){const cur=wstage[flow.screen];return '<div class="stepper">'+WSTEPS.map((s,i)=>{const n=i+1;const cls=n<cur?'done':(n===cur?'cur':'');const circ=n<cur?IC.check:n;return `<div class="st ${cls}"><div class="circ">${circ}</div><div class="lbl">${s}</div></div>`+(i<4?'<div class="line"></div>':'');}).join('')+'</div>';}
function cshell(inner,showStepper=true){$('#customer').innerHTML=`<div class="cust-top"><div class="l"><span class="logo2">${IC.logo}</span> ONESYS e-invoicing <span class="poweredby">· powered by Verinvo</span></div><button class="exit" id="exitp">${IC.back} ${role==='client'?'Back to my setup':'Exit preview'}</button></div><div class="wizwrap">${showStepper?wstepper():''}<div class="screen">${inner}</div></div>`;$('#exitp').onclick=exitCustomer;}
function wnext(){const i=WSCREENS.indexOf(flow.screen);flow.screen=WSCREENS[Math.min(i+1,WSCREENS.length-1)];renderWizard();}
function wprev(){const i=WSCREENS.indexOf(flow.screen);flow.screen=WSCREENS[Math.max(i-1,0)];renderWizard();}
function renderWizard(){({landing:wLanding,verify:wVerify,identify:wIdentify,plan:wPlan,signpay:wSignPay,gov:wGov,provision:wProvision,live:wLive})[flow.screen]();}
function wLanding(){cshell(`<div style="text-align:center;padding:8px 0"><span class="logo2" style="width:48px;height:48px;font-size:22px;border-radius:14px;margin:0 auto 16px;display:flex">${IC.logo}</span><h2>Set up ONESYS e-invoicing</h2><p class="lead">You've been invited to activate electronic invoicing for <b>${flow.customer}</b>. About 10 minutes — we'll guide each step.</p><div style="display:flex;flex-direction:column;gap:9px;max-width:340px;margin:0 auto 22px;text-align:left">${['Confirm your company details','Choose a plan and pay','Authorize in Taxisnet & myDATA','Go live automatically'].map((t,i)=>`<div style="display:flex;gap:10px;align-items:center;font-size:13.5px"><span style="width:22px;height:22px;border-radius:50%;background:var(--brand-bg);color:var(--brand600);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">${i+1}</span>${t}</div>`).join('')}</div><button class="btn btn-primary btn-lg" id="start">Get started ${IC.arrow}</button></div>`,false);$('#start').onclick=wnext;}
function wVerify(){cshell(`<h2>Verify it's you</h2><p class="lead">We sent a 6-digit code over Viber. Enter it below.</p><div class="otp" id="otp">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" data-i="${i}">`).join('')}</div><div style="text-align:center"><button class="btn" id="resend" style="border:0;color:var(--brand600);background:transparent;font-weight:800">Resend over Viber</button></div><div class="navrow"><button class="btn" id="bk">${IC.back} Back</button><button class="btn btn-primary" id="nx" disabled>Verify ${IC.arrow}</button></div>`);const inps=[...document.querySelectorAll('.otp input')];inps.forEach((inp,i)=>{inp.oninput=()=>{if(inp.value&&i<5)inps[i+1].focus();$('#nx').disabled=!inps.every(x=>x.value);};inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&i>0)inps[i-1].focus();};});inps[0].focus();$('#resend').onclick=()=>toast('Code re-sent over Viber');$('#bk').onclick=wprev;$('#nx').onclick=()=>{toast('Verified');wnext();};}
function wIdentify(){const f=flow.looked;cshell(`<h2>Confirm your company details</h2><p class="lead">Enter your VAT number (AFM). We'll pull the rest from the registry so you don't fill it in by hand.</p><div class="field"><label>VAT number (AFM)</label><div style="display:flex;gap:9px"><input id="afm" placeholder="e.g. 094117852" value="${f?'094117852':''}" style="flex:1"><button class="btn btn-primary" id="look">${f?'Looked up':'Look up'}</button></div>${!f?'<div class="hint">Try any number — simulated registry lookup.</div>':''}</div><div class="lookcard ${f?'filled':''}">${f?`<div class="lab">From the business registry (GEMI / AADE) — edit if needed</div><div class="two"><div class="field done"><label>Company name</label><input value="${flow.customer}"></div><div class="field done"><label>DOY (tax office)</label><input value="ΙΒ' Athinon"></div></div><div class="two"><div class="field done"><label>GEMI / registration</label><input value="140218903000"></div><div class="field done"><label>Legal representative</label><input value="Manolis Petrou"></div></div><div class="field done"><label>Registered address</label><input value="Ermou 12, Athens 10563, Greece"></div><div class="field" style="margin-top:14px"><label>Invite your accountant (optional) — joins the same case</label><input placeholder="accountant@email.gr"></div>`:'<div style="text-align:center;color:var(--mut);font-size:13px;padding:14px 0">Company details appear here after lookup.</div>'}</div><div class="navrow"><button class="btn" id="bk">${IC.back} Back</button><button class="btn btn-primary" id="nx" ${f?'':'disabled'}>Confirm &amp; continue ${IC.arrow}</button></div>`);$('#bk').onclick=wprev;$('#look').onclick=()=>{const b=$('#look');b.innerHTML='<span class="spin" style="width:15px;height:15px;border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span>';setTimeout(()=>{flow.looked=true;renderWizard();toast('Details auto-filled from registry');},850);};if(f)$('#nx').onclick=wnext;}
function wPlan(){cshell(`<h2>Choose your plan</h2><p class="lead">Priced by the number of documents you issue per year.</p><div class="plans" id="plans">${PLANS.map((p,i)=>`<div class="planopt ${flow.plan===i?'sel':''}" data-p="${i}"><div class="tick">${IC.check}</div><div class="docs">${p.docs}</div><div class="sub">documents / year</div><div class="price">€${p.price}<span style="color:var(--mut);font-weight:600"> + VAT</span></div></div>`).join('')}</div><div class="two" style="margin-top:18px"><div class="field"><label>Coupon (optional)</label><input id="cp" placeholder="Enter code" value="${flow.coupon}"></div><div class="field"><label>Alternative internet / phone bill</label><div class="dropzone ${flow.phonebill?'has':''}" id="dz">${flow.phonebill?IC.check+' COSMOTE-bill.pdf added':'Drag &amp; drop or tap to upload'}</div></div></div>${flow.phonebill?`<div class="lookcard filled" style="margin-top:14px"><div class="lab">Read from your bill — mandatory alternative-internet details (ΦΕΚ)</div><div class="two"><div class="field done"><label>Internet provider</label><input value="COSMOTE"></div><div class="field done"><label>Connection type</label><input value="5G"></div></div><div class="two"><div class="field done"><label>Connection number</label><input value="2284053130"></div><div class="field done"><label>Contract start date</label><input value="19/05/2025"></div></div></div>`:''}<div class="navrow"><button class="btn" id="bk">${IC.back} Back</button><button class="btn btn-primary" id="nx">Review order ${IC.arrow}</button></div>`);$('#plans').onclick=e=>{const o=e.target.closest('[data-p]');if(o){flow.plan=+o.dataset.p;renderWizard();}};$('#dz').onclick=()=>{flow.phonebill=true;renderWizard();toast('Phone bill attached — details extracted');};$('#bk').onclick=wprev;$('#nx').onclick=()=>{flow.coupon=$('#cp').value;wnext();};}
function wSignPay(){const p=PLANS[flow.plan];const vt=Math.round(p.price*.24);const tot=p.price+vt;cshell(`<h2>Sign &amp; pay</h2><p class="lead">Review, sign, and pay in one place. No bank transfer or proof screenshots.</p><div class="summary" style="margin-bottom:18px"><div class="row"><span>ONESYS plan · ${p.docs} docs/year</span><span>€${p.price}</span></div><div class="row"><span>VAT (24%)</span><span>€${vt}</span></div>${flow.coupon?`<div class="row"><span>Coupon ${flow.coupon}</span><span>applied</span></div>`:''}<div class="row"><span>Total due today</span><span>€${tot}</span></div></div><div class="paycard"><div class="ph"><b>Sign the agreement</b><span class="brandtag digink">Digink</span><span class="st">${flow.signed?'<span class="chip ok"><i></i>Signed</span>':'<span class="chip todo"><i></i>Not signed</span>'}</span></div><div class="sigpad ${flow.signed?'signed':''}" id="sig">${flow.signed?'<span class="sig-name">Manolis Petrou</span>':'Tap to sign'}</div></div><div class="paycard"><div class="ph"><b>Payment</b><span class="brandtag stripe">Stripe</span><span class="st">${flow.paid?'<span class="chip ok"><i></i>Paid €'+tot+'</span>':'<span class="chip todo"><i></i>Unpaid</span>'}</span></div>${flow.paid?'<div style="font-size:13px;color:var(--sec)">Payment confirmed instantly — the purchase record is created automatically.</div>':`<div class="field"><label>Card number</label><input placeholder="4242 4242 4242 4242"></div><div class="two"><div class="field"><label>Expiry</label><input placeholder="12 / 28"></div><div class="field"><label>CVC</label><input placeholder="123"></div></div><button class="btn btn-primary btn-block" id="pay">Pay €${tot}</button>`}</div><div class="navrow"><button class="btn" id="bk">${IC.back} Back</button><button class="btn btn-primary" id="nx" ${flow.signed&&flow.paid?'':'disabled'}>Continue ${IC.arrow}</button></div>`);$('#sig').onclick=()=>{if(flow.signed)return;flow.signed=true;renderWizard();toast('Signed via Digink');};$('#bk').onclick=wprev;if(!flow.paid&&$('#pay'))$('#pay').onclick=()=>{const b=$('#pay');b.innerHTML='<span class="spin" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Processing…';b.disabled=true;setTimeout(()=>{flow.paid=true;renderWizard();toast('Payment confirmed');},1000);};if(flow.signed&&flow.paid)$('#nx').onclick=wnext;}
function wGov(){const both=flow.auth==='ok'&&flow.decl==='ok';const chip=s=>s==='ok'?'<span class="chip ok"><i></i>Accepted</span>':s==='wait'?'<span class="chip wait"><i></i>Awaiting</span>':'<span class="chip todo"><i></i>To do</span>';cshell(`<h2>Authorization &amp; declaration</h2><p class="lead">Two steps in the government portals. We've pre-filled the values — complete each and we'll track acceptance.</p><div class="task"><div class="th"><b>1 · Authorize ONESYS in Taxisnet</b><span class="st">${chip(flow.auth)}</span></div><div class="desc">Authorize ONESYS as your certified e-invoicing provider.</div><div class="prefill">Provider VAT (AFM): <code>801361524</code> · Provider contract no.: <code>0716</code></div>${flow.auth==='ok'?'':`<div style="display:flex;gap:9px"><button class="btn" id="opa">Open Taxisnet</button><button class="btn btn-primary" id="doa" ${flow.auth==='wait'?'disabled':''}>I've authorized</button></div>`}</div><div class="task"><div class="th"><b>2 · Complete the myDATA declaration</b><span class="st">${chip(flow.decl)}</span></div><div class="desc">Declare the provider in myDATA using your contract and internet-provider details.</div><div class="prefill">Alternative-internet (ΦΕΚ), from the bill — Provider: <code>COSMOTE</code> · Type: <code>5G</code> · Connection no.: <code>2284053130</code> · Contract start: <code>19/05/2025</code></div>${flow.decl==='ok'?'':`<div style="display:flex;gap:9px"><button class="btn" id="opd">Open myDATA</button><button class="btn btn-primary" id="dod" ${flow.decl==='wait'?'disabled':''}>I've declared</button></div>`}</div><div class="shared">${IC.bolt} Your owner and accountant both see this status live — no separate email threads.</div><div class="navrow"><button class="btn" id="bk">${IC.back} Back</button><button class="btn btn-primary" id="nx" ${both?'':'disabled'}>Continue ${IC.arrow}</button></div>`);$('#bk').onclick=wprev;const accept=k=>{flow[k]='wait';renderWizard();setTimeout(()=>{flow[k]='ok';renderWizard();toast((k==='auth'?'Authorization':'Declaration')+' accepted by ONESYS');},1200);};if($('#opa'))$('#opa').onclick=()=>toast('Opening Taxisnet…');if($('#doa'))$('#doa').onclick=()=>accept('auth');if($('#opd'))$('#opd').onclick=()=>toast('Opening myDATA…');if($('#dod'))$('#dod').onclick=()=>accept('decl');if(both)$('#nx').onclick=wnext;}
const PROV=['Create business profile in Verinvo (OX HOME)','Generate API credentials','Push credentials to the billing system','Run functional test submission','Confirm go-live'];
function wProvision(){cshell(`<h2>Setting you up</h2><p class="lead">Everything from here is automatic — no technician re-keying, no phone calls.</p><ul class="provlist" id="prov">${PROV.map((t,i)=>`<li class="provitem pending" data-i="${i}"><span class="ic"><span class="dotpending"></span></span>${t}</li>`).join('')}</ul><div class="navrow"><button class="btn" id="bk">${IC.back} Back</button><button class="btn btn-primary" id="nx" ${flow.provDone?'':'disabled'}>Continue ${IC.arrow}</button></div>`);$('#bk').onclick=wprev;if(flow.provDone){document.querySelectorAll('.provitem').forEach(li=>{li.className='provitem done';li.querySelector('.ic').innerHTML='<span class="checkc">'+IC.check+'</span>';});$('#nx').onclick=wnext;return;}const items=[...document.querySelectorAll('.provitem')];let i=0;const step=()=>{if(i>0){items[i-1].className='provitem done';items[i-1].querySelector('.ic').innerHTML='<span class="checkc">'+IC.check+'</span>';}if(i<items.length){items[i].className='provitem active';items[i].querySelector('.ic').innerHTML='<span class="spin"></span>';i++;setTimeout(step,760);}else{flow.provDone=true;$('#nx').disabled=false;$('#nx').onclick=wnext;toast('Setup complete');}};setTimeout(step,500);}
function wLive(){const p=PLANS[flow.plan];cshell(`<div class="livehero"><div class="livebadge">${IC.spark}</div><h2>${flow.customer} is live 🎉</h2><p>You can now issue e-invoices. A confirmation has been sent over Viber to you and your accountant.</p><div style="max-width:400px;margin:0 auto 20px;text-align:left;background:var(--brand-bg);border:1px solid #CFE0F4;border-radius:12px;padding:13px 15px;font-size:13px"><div style="display:flex;gap:8px;align-items:center;font-weight:800;color:var(--brand600);margin-bottom:6px;font-size:12.5px">${IC.bolt} Viber confirmation</div>You're live on ONESYS e-invoicing (${p.docs} docs/year). Need help? Just reply here.</div><button class="btn btn-primary btn-lg" id="done">${role==='client'?'Back to my setup':'Back to dashboard'}</button></div>`,false);$('#done').onclick=exitCustomer;}

renderLauncher();
</script>
</body>
</html>
